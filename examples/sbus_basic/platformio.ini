; Exemples de build pour deux ESP32-S3 :
;   - devkitc1 avec pont USB-UART (moniteur sur /dev/ttyUSB*)
;   - devkitc1 N8R8 USB natif seul (moniteur sur /dev/ttyACM0)
; Build/upload: pio run -d examples/sbus_basic -e <env> -t upload

[env:esp32-s3-devkitc1-n16r16]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r16
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../

[env:esp32-s3-devkitc1-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSBUS_RX_PIN=7
lib_deps = symlink://../../
